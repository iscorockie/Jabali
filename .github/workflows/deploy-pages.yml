name: Build, Lint & Typecheck Next.js App + Stripe API

on:
  push:
    branches:
      - main
      - arena/01a0f714-jabali
      - arena/01a0f781-jabali
      - arena/01a0f7d2-jabali
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Full Next.js Application (Pages + Dynamic Stripe APIs)
        run: npm run build
