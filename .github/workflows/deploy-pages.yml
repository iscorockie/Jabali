name: Build & Verify Full Next.js App & Stripe API

on:
  push:
    branches:
      - main
      - arena/01a0f714-jabali
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Full Next.js Application (Pages + Dynamic Stripe APIs)
        run: npm run build
